<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Fondo circular -->
  <circle cx="100" cy="100" r="90" fill="#1a1a2e" stroke="#16213e" stroke-width="2"/>
  
  <!-- Circuitos/neuronas estilizadas -->
  <g fill="none" stroke="#0f3460" stroke-width="2" opacity="0.6">
    <path d="M40,100 Q60,80 80,100 T120,100"/>
    <path d="M80,100 Q100,120 120,100 T160,100"/>
    <path d="M60,70 Q80,90 100,70 T140,70"/>
    <path d="M60,130 Q80,110 100,130 T140,130"/>
  </g>
  
  <!-- Nodos de conexión -->
  <g fill="#e94560">
    <circle cx="80" cy="100" r="6"/>
    <circle cx="120" cy="100" r="6"/>
    <circle cx="100" cy="70" r="5"/>
    <circle cx="100" cy="130" r="5"/>
    <circle cx="60" cy="100" r="4"/>
    <circle cx="140" cy="100" r="4"/>
  </g>
  
  <!-- Lupa principal -->
  <g transform="translate(100,100)">
    <!-- Círculo de la lupa -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="#e94560" stroke-width="4"/>
    <!-- Mango de la lupa -->
    <line x1="25" y1="25" x2="45" y2="45" stroke="#e94560" stroke-width="5" stroke-linecap="round"/>
    <!-- Brillo en la lupa -->
    <path d="M-20,-10 Q-10,-25 5,-20" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  </g>
  
  <!-- Letra "S" estilizada (de Semántico) -->
  <text x="100" y="165" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e94560" text-anchor="middle">S</text>
  
  <!-- Puntos decorativos -->
  <g fill="#0f3460" opacity="0.8">
    <circle cx="30" cy="50" r="2"/>
    <circle cx="170" cy="50" r="2"/>
    <circle cx="30" cy="150" r="2"/>
    <circle cx="170" cy="150" r="2"/>
  </g>
</svg>