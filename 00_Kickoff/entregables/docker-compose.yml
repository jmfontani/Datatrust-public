# =================================================================
# Docker Compose - Buscador Semántico de Datasets (datos.gob.es)
# PostgreSQL + pgvector (v1.2 - Solución Google Drive)
# =================================================================
# Problema: Google Drive no permite permisos de ejecución.
# Solución: Copiar script a volumen interno con permisos correctos.
# =================================================================

services:
  # ================================================================
  # SERVICIO AUXILIAR: Copiar scripts con permisos correctos
  # ================================================================
  init-scripts:
    image: busybox:latest
    container_name: pfm_init_scripts
    volumes:
      - scripts_data:/scripts
      - ./init-db:/init-db-source:ro
    command: >
      sh -c "
        cp /init-db-source/*.sh /scripts/ 2>/dev/null || true
        chmod +x /scripts/*.sh 2>/dev/null || true
        sed -i '1s|#!/bin/bash|#!/usr/bin/env bash|g' /scripts/*.sh 2>/dev/null || true
        echo 'Scripts copiados con permisos'
        ls -la /scripts/
      "
    restart: "no"
    networks:
      - pfm_network

  # ================================================================
  # BASE DE DATOS: PostgreSQL 15 con extensión pgvector
  # ================================================================
  db:
    image: ankane/pgvector:latest
    container_name: pfm_postgres
    restart: unless-stopped
    depends_on:
      init-scripts:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pfm_user}
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: ${POSTGRES_DB:-pfm_datasets}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - scripts_data:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pfm_user} -d ${POSTGRES_DB:-pfm_datasets}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - pfm_network

  # ================================================================
  # ADMIN: pgAdmin 4 (opcional, para gestión visual de PostgreSQL)
  # ================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pfm_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@pfm.example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_password}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - pfm_network

# =================================================================
# VOLÚMENES PERSISTENTES
# =================================================================
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  scripts_data:
    driver: local

# =================================================================
# REDES
# =================================================================
networks:
  pfm_network:
    driver: bridge
